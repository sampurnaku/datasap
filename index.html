<style>

@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--tx:#e8ebef;--mu:#9aa3af;--bd:#2c333c;--pr:#4da3ff;--ok:#4ade80;--wr:#fbbf24;--er:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
h1{font-size:18px;margin:14px 0 2px}.sub{color:var(--mu);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pick button{padding:14px 10px;text-align:center}

.pick button.done::before{content:'\2713  '}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--bd);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--mu)}
.chip.ok{color:var(--ok);border-color:var(--ok)}
button,select,input[type=search]{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button:disabled{opacity:.5}

td.n{text-align:right}.neg{color:var(--er)}.pos{color:var(--wr)}

/* ===== tampilan disesuaikan dengan Menu Utama ===== */
:root{--g1:#34d399;--g2:#059669;--gon:#03150d}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(1100px 760px at 15% -10%,#1b1f4d 0,transparent 60%),radial-gradient(900px 700px at 100% 110%,#3a1550 0,transparent 55%),#0b0d1f}

@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(6vmax,4vmax) scale(1.12)}66%{transform:translate(-4vmax,7vmax) scale(.94)}}

@keyframes tw{50%{opacity:.8}}
@keyframes shine{to{background-position:250% 0}}
.home{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 12px;margin:2px 0 10px;border-radius:999px;text-decoration:none;color:#fff;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .25s,border-color .25s,box-shadow .25s;-webkit-tap-highlight-color:transparent}

.home:hover,.home:focus-visible{border-color:rgba(255,255,255,.45);box-shadow:0 10px 26px -10px var(--g1);outline:none}

.ico{flex:none;width:46px;height:46px;border-radius:15px;display:inline-grid;place-items:center;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 22px -8px var(--g1);-webkit-text-fill-color:initial}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ttl{background:none;color:#fff;-webkit-text-fill-color:#fff}}

html:root:root:root{--bg:#0b0d1f;--card:#151a3a;--tx:#f4f6ff;--mu:#aab4d8;--bd:#2b3262;--pr:#34d399;--ok:#6ee7b7;--wr:#ffc266;--er:#ff8fa3;color-scheme:dark}

<body>
<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<a class="home" href="/menuGit/" aria-label="Kembali ke Menu Utama"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Menu Utama</a>
<div id="upd" class="card hid" style="border-color:var(--pr)">Versi baru aplikasi tersedia. <button class="p" id="rl">Muat ulang</button> <span class="sub">(data yang sedang tampil akan hilang)</span></div>
<h1><i class="ico"><svg viewBox="0 0 24 24"><path d="M5 8h13l-3.5-3.5M19 16H6l3.5 3.5"/></svg></i><span class="ttl">Cek PZZL vs SAP</span></h1>

  </div>

</div>

<p class="sub" style="text-align:center;margin:18px 0">Versi aplikasi: <b id="ver"></b> &middot; <a href="#" id="upd2" style="color:var(--pr)">Perbarui aplikasi</a></p>

<script>
/*CORE*/
// ---------- Pembaca xlsx streaming (tanpa library, hemat memori untuk file besar) ----------
async function zipEntries(file){
  const tail=new DataView(await file.slice(Math.max(0,file.size-66000),file.size).arrayBuffer());
  let p=tail.byteLength-22;while(p>=0&&tail.getUint32(p,true)!==0x06054b50)p--;
  if(p<0)throw new Error('Bukan file xlsx yang valid');
  const n=tail.getUint16(p+10,true),sz=tail.getUint32(p+12,true),off=tail.getUint32(p+16,true);
  const cd=new DataView(await file.slice(off,off+sz).arrayBuffer());const out={};let q=0;
  for(let i=0;i<n;i++){
    const nl=cd.getUint16(q+28,true),el=cd.getUint16(q+30,true),cl=cd.getUint16(q+32,true);
    const name=new TextDecoder().decode(new Uint8Array(cd.buffer,q+46,nl));
    out[name]={method:cd.getUint16(q+10,true),csize:cd.getUint32(q+20,true),off:cd.getUint32(q+42,true)};
    q+=46+nl+el+cl;
  }
  return out;
}
async function* chunks(file,e){
  const lh=new DataView(await file.slice(e.off,e.off+30).arrayBuffer());
  const st=e.off+30+lh.getUint16(26,true)+lh.getUint16(28,true);
  let s=file.slice(st,st+e.csize).stream();
  if(e.method===8)s=s.pipeThrough(new DecompressionStream('deflate-raw'));
  const rd=s.pipeThrough(new TextDecoderStream()).getReader();
  try{for(;;){const{done,value}=await rd.read();if(done)return;yield value}}finally{rd.cancel().catch(()=>{})}
}
async function entryText(file,e){let t='';for await(const c of chunks(file,e))t+=c;return t}
const dec=s=>s.indexOf('&')<0?s:s.replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos);/gi,(m,k)=>{
  k=k.toLowerCase();if(k[0]==='#')return String.fromCodePoint(k[1]==='x'?parseInt(k.slice(2),16):+k.slice(1));
  return{amp:'&',lt:'<',gt:'>',quot:'"',apos:"'"}[k]});
const colIdx=l=>{let n=0;for(const c of l)n=n*26+c.charCodeAt(0)-64;return n-1};

// Hasil: array baris; sel string = nilai, sel number = indeks sharedStrings (di-resolve terpisah)
async function readSheet(file,{cols,maxRows,onRows}={}){
  const z=await zipEntries(file);
  const wb=await entryText(file,z['xl/workbook.xml']);
  const rid=/<sheet\b[^>]*r:id="([^"]+)"/.exec(wb)[1];
  const rels=await entryText(file,z['xl/_rels/workbook.xml.rels']);
  const tag=new RegExp('<Relationship\\b[^>]*Id="'+rid+'"[^>]*>').exec(rels)[0];
  let tg=/Target="([^"]+)"/.exec(tag)[1];tg=tg[0]==='/'?tg.slice(1):'xl/'+tg;
  const want=cols?new Set(cols):null,rows=[];let buf='';
  const rowRe=/<row\b[^>]*[^\/]>([\s\S]*?)<\/row>/g,cellRe=/<c r="([A-Z]+)\d+"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
  outer:for await(const ch of chunks(file,z[tg])){
    buf+=ch;const end=buf.lastIndexOf('</row>');if(end<0)continue;
    const part=buf.slice(0,end+6);buf=buf.slice(end+6);
    rowRe.lastIndex=0;let m;
    while((m=rowRe.exec(part))){
      const r=[];cellRe.lastIndex=0;let c;const body=m[1];
      while((c=cellRe.exec(body))){
        const ci=colIdx(c[1]);if(want&&!want.has(ci))continue;
        const inner=c[3];if(inner===undefined)continue;
        const t=(/\bt="(\w+)"/.exec(c[2])||[])[1];
        if(t==='inlineStr'){const x=/<t[^>]*>([^<]*)<\/t>/.exec(inner);r[ci]=x?dec(x[1]):''}
        else{const v=/<v>([^<]*)<\/v>/.exec(inner);if(!v)continue;r[ci]=t==='s'?+v[1]:dec(v[1])}
      }
      rows.push(r);
      if(maxRows&&rows.length>=maxRows)break outer;
    }
    if(onRows)onRows(rows.length);
  }
  return{rows,file,z};
}
async function resolve(sh,cols){
  const need=new Set();
  for(const r of sh.rows){if(cols){for(const c of cols)if(typeof r[c]==='number')need.add(r[c])}else r.forEach(v=>{if(typeof v==='number')need.add(v)})}
  const map=new Map();let left=need.size,i=0,buf='';
  if(left){
    const re=/<t[^>]*>([^<]*)<\/t>/g;
    scan:for await(const ch of chunks(sh.file,sh.z['xl/sharedStrings.xml'])){
      buf+=ch;let pos=0,p;
      while((p=buf.indexOf('</si>',pos))>=0){
        if(need.has(i)){const si=buf.slice(pos,p);let t='',m;re.lastIndex=0;while((m=re.exec(si)))t+=m[1];map.set(i,dec(t));if(--left===0)break scan}
        i++;pos=p+5;
      }
      buf=buf.slice(pos);
    }
  }
  for(const r of sh.rows){
    if(cols){for(const c of cols)if(typeof r[c]==='number')r[c]=map.get(r[c])??''}
    else r.forEach((v,k)=>{if(typeof v==='number')r[k]=map.get(v)??''});
  }
  return sh.rows;
}
const KNOWN=['Barcode','Jenis Proses','Trans. Date','Doc. Reff','Kode Order','Material','Color','Grade','Qty','Batch','Barcode ID','Unrestricted Stock','Stock in Transfer (Storage Location)','Material Description','Base Unit','Storage Location','Description of Storage Location'];
const canon=v=>{const t=String(v??'').replace(/\s+/g,' ').trim(),l=t.toLowerCase();return KNOWN.find(k=>k.toLowerCase()===l)||t};
async function readHeader(file){const sh=await readSheet(file,{maxRows:1});const [h]=await resolve(sh);return{head:h.map(canon),sh}}
const hix=(head,name)=>head.indexOf(name);

// ---------- Logika pencocokan ----------
function buildMasterMap(pairs){ // pairs: iterable [barcode,batch]
  const m=new Map();
  for(const[b,t]of pairs){
    if(!b||b==='-'||!t)continue;
    const o=m.get(b);
    if(o===undefined)m.set(b,t);
    else if(typeof o==='string'){if(o!==t)m.set(b,[o,t])}
    else if(!o.includes(t))o.push(t);
  }
  return m;
}
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
function compute(sd,sap,master){
  // sd/sap: {head, rows}
  const S=n=>hix(sd.head,n),P=n=>hix(sap.head,n);
  const iBc=S('Barcode'),iQ=S('Qty'),iBun=S('Bun');
  const unitOf=r=>{ // satuan PZZL (Bun); meter dikonversi ke yard (dibagi 0,9144), yard tetap, satuan lain (mis. KG) tetap
    const q=num(r[iQ]),bun=String(r[iBun]??'').trim(),ub=bun.toLowerCase();
    const isM=['m','mtr','mtrs','meter','metre','meters','metres'].includes(ub),isY=['yard','yards','yd','yds'].includes(ub);
    return{q,bun,isM,su:isM||isY?'YD':bun.toUpperCase(),qy:!bun?null:isM?+(q/0.9144).toFixed(2):q};
  };
  const iB=P('Batch'),iUn=P('Base Unit');
  const colU=P('Unrestricted Stock'),colT=P('Stock in Transfer (Storage Location)');
  const sapU=i=>num(sap.rows[i][colU]),sapT=i=>num(sap.rows[i][colT]);
  const sapBy=new Map();
  sap.rows.forEach((r,i)=>{const b=r[iB];if(!b)return;(sapBy.get(b)||sapBy.set(b,[]).get(b)).push(i)});
  const sapQty=i=>sapU(i)+sapT(i); // Qty SAP = Unrestricted + Stock in Transfer
  const used=new Set(),sdOnly=[],ok=[],sdAll=[];
  for(const r of sd.rows){
    const bc=String(r[iBc]||'').trim();if(!bc)continue;
    const c=master.get(bc),list=c===undefined?[]:typeof c==='string'?[c]:c;
    list.forEach(b=>used.add(b));
    const hit=list.find(b=>sapBy.has(b));
    const note=list.length>1?'Barcode punya '+list.length+' batch: '+list.map(b=>b+(sapBy.has(b)?' (ada di SAP)':' (tidak ada di SAP)')).join(' ; '):'';
    sdAll.push([bc,hit||list.join(' / '),hit?'Cocok':list.length?'Batch tidak ada di SAP':'Barcode belum ada di master batch',note,...sd.head.map((h,k)=>h==='Barcode'?null:r[k]).filter((v,k)=>sd.head[k]!=='Barcode')]);
    const u0=unitOf(r),base=[bc,list.join(' / '),r[S('Jenis Proses')],r[S('Trans. Date')],r[S('Doc. Reff')],r[S('Kode Order')],r[S('Material')],r[S('Color')],r[S('Grade')],u0.q,u0.bun,u0.qy,u0.bun?u0.su:''];
    if(hit){
      const qs=sapBy.get(hit).reduce((a,i)=>a+sapQty(i),0),isYd=sapBy.get(hit).every(i=>sap.rows[i][iUn]==='YD');
      const us=sapBy.get(hit).reduce((a,i)=>a+sapU(i),0),ts=sapBy.get(hit).reduce((a,i)=>a+sapT(i),0);
      const{q,bun,isM,su,qy}=u0;
      const sunits=[...new Set(sapBy.get(hit).map(k=>String(sap.rows[k][iUn]||'').toUpperCase()))],sapUnit=sunits.length===1?sunits[0]:'';
      const same=!!su&&!!sapUnit&&su===sapUnit;
      const sel=same?+(qy-qs).toFixed(2):null,kt=note?[note]:[];
      if(isM)kt.push('Satuan PZZL meter, dikonversi ke yard (1 yard = 0,9144 m)');
      if(!bun)kt.push('Satuan PZZL (Bun) kosong, selisih tidak dihitung');
      else if(!same)kt.push('Satuan PZZL ('+bun+') berbeda dengan satuan SAP ('+(sapUnit||'campuran')+'), selisih tidak dihitung');
      if(sel!==null&&Math.abs(sel)>0.01)kt.push(qy>0&&Math.abs(qs-2*qy)<0.01?'Qty SAP = 2x Qty PZZL (kemungkinan double)':sel<0?'Qty SAP lebih besar dari Qty PZZL':'Qty PZZL lebih besar dari Qty SAP');
      ok.push([bc,hit,r[S('Jenis Proses')],r[S('Kode Order')],r[S('Color')],q,bun,qy,bun?su:'',+qs.toFixed(2),sel,+us.toFixed(2),+ts.toFixed(2),kt.join(' ; ')]);
    }else sdOnly.push([...base,list.length?'Batch tidak ada di SAP':'Barcode belum ada di master batch',[note,u0.isM?'Satuan PZZL meter, dikonversi ke yard (1 yard = 0,9144 m)':''].filter(Boolean).join(' ; ')]);
  }
  const sapOnly=[];
  sap.rows.forEach((r,i)=>{if(used.has(r[iB]))return;
    const rws=sapBy.get(r[iB])||[i],ket=[];
    if(rws.length>1)ket.push('Batch muncul di '+rws.length+' baris SAP (total qty '+(+rws.reduce((a,k)=>a+sapQty(k),0).toFixed(2))+')');
    if(sapT(i)>0)ket.push('Ada stock in transfer');
    sapOnly.push([r[P('Material')],r[P('Material Description')],r[iB],+sapU(i).toFixed(2),+sapT(i).toFixed(2),+sapQty(i).toFixed(2),r[iUn],r[P('Storage Location')],r[P('Description of Storage Location')],ket.join(' ; ')])});
  return{sdOnly,sapOnly,ok,sdAll,sdHead:sd.head.filter(h=>h!=='Barcode')};
}

// ---------- Penulis xlsx sederhana (tanpa library, bisa offline) ----------
function crcUpdate(r,b){let t=crcUpdate.t;if(!t){t=crcUpdate.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}for(let i=0;i<b.length;i++)r=t[(r^b[i])&255]^(r>>>8);return r}
// kompres bertahap (deflate) supaya file hasil kecil dan hemat memori
async function deflateChunks(chunks){
  const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter(),rd=cs.readable.getReader(),out=[];
  const reading=(async()=>{for(;;){const{done,value}=await rd.read();if(done)return;out.push(value)}})();
  let crc=-1,size=0;
  for(const c of chunks){crc=crcUpdate(crc,c);size+=c.length;await w.write(c)}
  await w.close();await reading;
  return{out,crc:(crc^-1)>>>0,size,csize:out.reduce((a,p)=>a+p.length,0)};
}
async function makeXlsx(sheets){
  const te=new TextEncoder(),x=v=>String(v).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const col=i=>{let s='';for(let n=i+1;n>0;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s};
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',files=[];
  files.push(['[Content_Types].xml',[H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>']]);
  files.push(['_rels/.rels',[H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>']]);
  files.push(['xl/workbook.xml',[H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map(([n],i)=>`<sheet name="${x(n).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>']]);
  files.push(['xl/_rels/workbook.xml.rels',[H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+'</Relationships>']]);
  function* sheetChunks(aoa){
    yield H+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetData>';
    for(let s=0;s<aoa.length;s+=4000){
      let b='';const e=Math.min(s+4000,aoa.length);
      for(let ri=s;ri<e;ri++){b+=`<row r="${ri+1}">`;aoa[ri].forEach((v,ci)=>{
        if(v===null||v===undefined||v==='')return;const ref=col(ci)+(ri+1);
        b+=typeof v==='number'&&isFinite(v)?`<c r="${ref}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"><is><t>${x(v)}</t></is></c>`});b+='</row>'}
      yield b;
    }
    yield '</sheetData></worksheet>';
  }
  sheets.forEach(([,aoa],i)=>files.push([`xl/worksheets/sheet${i+1}.xml`,sheetChunks(aoa)]));
  const parts=[],cd=[];let off=0;
  for(const[name,gen]of files){
    const nb=te.encode(name);
    const{out,crc,size,csize}=await deflateChunks((function*(){for(const t of gen)yield te.encode(t)})());
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,8,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,csize,true);lh.setUint32(22,size,true);lh.setUint16(26,nb.length,true);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,8,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,csize,true);ch.setUint32(24,size,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
    parts.push(lh.buffer,nb,...out);cd.push(ch.buffer,nb);off+=30+nb.length+csize;
  }
  const csz=cd.reduce((a,p)=>a+p.byteLength,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,e.buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
/*UI*/
if(typeof document!=='undefined'){
const $=s=>document.querySelector(s);
const st=t=>$('#st').textContent=t;
const nf=n=>n.toLocaleString('id-ID');
const files={sd:null,sap:null,master:null};let masterMap=null,masterInfo='';
const TABS={
  sdOnly:{t:'Ada di PZZL, tidak ada di SAP',n:'PZZL tidak ada di SAP',h:['Barcode','Batch (master)','Jenis Proses','Trans. Date','Doc. Reff','Kode Order','Material','Color','Grade','Qty PZZL','Satuan PZZL (Bun)','Qty PZZL (konversi)','Satuan konversi','Alasan','Keterangan'],f:2,q:9},
  sapOnly:{t:'Ada di SAP, tidak ada di PZZL',n:'SAP tidak ada di PZZL',h:['Material','Deskripsi','Batch','Unrestricted','In Transfer','Qty SAP (jumlah)','Unit','Kode Lokasi','Lokasi','Keterangan'],f:8,q:5},
  ok:{t:'Cocok di keduanya',n:'Cocok',h:['Barcode','Batch','Jenis Proses','Kode Order','Color','Qty PZZL','Satuan PZZL (Bun)','Qty PZZL (konversi)','Satuan konversi','Qty SAP (jumlah)','Selisih','SAP Unrestricted','SAP In Transfer','Keterangan'],f:2,q:5}
};
let R=null,tab='sdOnly',view=[],shown=0,src={};

// cache master di IndexedDB
const idb=()=>new Promise((ok,er)=>{const q=indexedDB.open('cekstock',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(q.result);q.onerror=()=>er(q.error)});
const kvGet=async k=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}};
const kvSet=async(k,v)=>{try{const d=await idb();await new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){}};
const kvDel=async k=>{try{const d=await idb();await new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=r;t.onerror=r})}catch(e){}};

function chips(){
  const c=(ok,t)=>`<span class="chip ${ok?'ok':''}">${ok?'&#10003; ':''}${t}</span>`;
  $('#chips').innerHTML=c(files.sd,files.sd?'PZZL: '+files.sd.name:'PZZL belum ada')+c(files.sap,files.sap?'Stock SAP: '+files.sap.name:'Stock SAP belum ada')+c(masterMap,masterMap?'Master batch: '+masterInfo:'Master batch belum ada');
  document.querySelectorAll('#pick button').forEach(b=>{const k=b.dataset.k;b.classList.toggle('done',!!(k==='master'?(files.master||masterMap):files[k]))});
  $('#go').disabled=!(files.sd&&files.sap&&(masterMap||files.master));
}
// Jenis file ditentukan oleh tombol yang dipilih (1/2/3), bukan oleh nama file. Yang diperiksa hanya kolom yang wajib ada.
const REQ={sd:['Barcode'],sap:['Batch','Unrestricted Stock'],master:['Batch','Barcode ID']};
const LBL={sd:'PZZL',sap:'Stock SAP',master:'Master Batch'};let want=null;
$('#pick').onclick=e=>{const b=e.target.closest('button[data-k]');if(!b)return;want=b.dataset.k;$('#fi').value='';$('#fi').click()};
$('#fi').onchange=async e=>{
  const f=e.target.files[0];if(!f||!want)return;
  st('Membaca '+f.name+'...');
  try{
    const{head}=await readHeader(f),miss=REQ[want].filter(c=>!head.includes(c));
    if(miss.length){st('File "'+f.name+'" tidak bisa dipakai sebagai '+LBL[want]+': kolom '+miss.join(', ')+' tidak ditemukan di baris pertama sheet pertama.');return}
    files[want]=f;st('');chips();
  }catch(err){st('Gagal membaca '+f.name+': '+err.message)}
};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loadTable(f,label){
  const sh=await readSheet(f,{onRows:n=>st('Membaca '+label+': '+nf(n)+' baris')});
  const rows=await resolve(sh);
  const head=rows.shift().map(canon);
  return{head,rows};
}
function* pairsFromText(t){for(const l of t.split('\n')){const k=l.indexOf('\t');if(k>0)yield[l.slice(0,k),l.slice(k+1)]}}
async function loadMaster(f){
  const{head}=await readHeader(f);
  const ib=head.indexOf('Batch'),ic=head.indexOf('Barcode ID');
  const sh=await readSheet(f,{cols:[ib,ic],onRows:n=>st('Master batch: '+nf(n)+' baris dibaca...')});
  st('Master batch: membaca teks batch & barcode...');
  const rows=await resolve(sh,[ib,ic]);rows.shift();
  const text=rows.filter(r=>r[ic]&&r[ic]!=='-'&&r[ib]).map(r=>r[ic]+'\t'+r[ib]).join('\n');
  masterMap=buildMasterMap(pairsFromText(text));
  masterInfo=nf(masterMap.size)+' barcode (baru diunggah)';
  await kvSet('master',{text,date:new Date().toLocaleString('id-ID'),n:masterMap.size});
}
function setTab(k){
  tab=k;document.querySelectorAll('.sum div').forEach(d=>d.classList.toggle('a',d.dataset.k===k));
  const T=TABS[k];$('#th').innerHTML='<tr>'+T.h.map(h=>`<th>${h}</th>`).join('')+'</tr>';
  const vals=[...new Set(R[k].map(r=>r[T.f]))].filter(Boolean).sort();
  $('#flt').innerHTML='<option value="">Semua '+T.h[T.f]+'</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('');
  $('#q').value='';$('#onlyd').checked=false;$('#dl').classList.toggle('hid',k!=='ok');filter();
}
function filter(){
  const T=TABS[tab],q=$('#q').value.trim().toLowerCase(),f=$('#flt').value,od=$('#onlyd').checked&&tab==='ok';
  view=R[tab].filter(r=>(!f||r[T.f]===f)&&(!od||(r[10]!==null&&Math.abs(r[10])>0.01))&&(!q||r.join('|').toLowerCase().includes(q)));
  shown=0;$('#tb').innerHTML='';more();
}
function more(){
  const T=TABS[tab],part=view.slice(shown,shown+300);shown+=part.length;
  $('#tb').insertAdjacentHTML('beforeend',part.map(r=>'<tr>'+r.map((v,i)=>{
    const isn=typeof v==='number'||(v===null&&(i===7||i===10));
    const cls=(isn?'n':'')+(tab==='ok'&&i===10&&v?(v<0?' neg':' pos'):'');
    return`<td class="${cls}">${v===null?'-':isn?nf(v):esc(v)}</td>`}).join('')+'</tr>').join(''));
  $('#cnt').textContent='Menampilkan '+nf(shown)+' dari '+nf(view.length)+' baris';
  $('#more').classList.toggle('hid',shown>=view.length);
}
function showResult(){
  const diff=R.ok.filter(r=>r[10]!==null&&Math.abs(r[10])>0.01).length;
  $('#sum').innerHTML=Object.keys(TABS).map(k=>`<div data-k="${k}"><b>${nf(R[k].length)}</b><span>${TABS[k].t}${k==='ok'?' ('+nf(diff)+' selisih qty)':''}${k!=='sapOnly'?' ['+nf(R[k].filter(r=>String(r[r.length-1]).startsWith('Barcode punya')).length)+' barcode 2 batch]':''}</span></div>`).join('');
  $('#sum').onclick=e=>{const d=e.target.closest('div[data-k]');if(d)setTab(d.dataset.k)};
  $('#res').classList.remove('hid');setTab(tab);
}
$('#q').oninput=filter;$('#flt').onchange=filter;$('#onlyd').onchange=filter;$('#more').onclick=more;
$('#go').onclick=async()=>{
  $('#go').disabled=true;const t0=Date.now();
  try{
    if(files.master){await loadMaster(files.master);files.master=null}
    const sd=await loadTable(files.sd,'PZZL'),sap=await loadTable(files.sap,'Stock SAP');
    st('Mencocokkan data...');await new Promise(r=>setTimeout(r,30));
    R=compute(sd,sap,masterMap);src={sd:files.sd.name,sap:files.sap.name,master:masterInfo};showResult();
    st('Selesai dalam '+Math.round((Date.now()-t0)/1000)+' detik. PZZL '+nf(sd.rows.length)+' baris, SAP '+nf(sap.rows.length)+' baris.');
  }catch(e){st('Gagal: '+e.message)}
  chips();
};
$('#clr').onclick=async()=>{await kvDel('master');masterMap=null;files.master=null;chips();st('Master tersimpan dihapus.')};
addEventListener('unhandledrejection',e=>st('Gagal: '+((e.reason&&e.reason.message)||e.reason)));
const save=(blob,name)=>{const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),60000)};
const nowTs=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return{txt:d.toLocaleString('id-ID'),fn:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+'-'+p(d.getMinutes())}};
const withTs=(h,rows,ts)=>[[...h,'Waktu Unduh'],...rows.map(r=>[...r,ts])];
const infoSheet=(ts,rows)=>['Info',[['Waktu unduh',ts],['File PZZL',src.sd],['File Stock SAP',src.sap],['Master batch',src.master],[],['Sheet','Jumlah baris'],...rows]];
$('#ex').onclick=()=>{
  st('Menyusun file Excel...');
  setTimeout(async()=>{
    const t=nowTs(),S=['sdOnly','sapOnly','ok'].map(k=>[TABS[k].n,withTs(TABS[k].h,R[k],t.txt)]);
    S.push(['PZZL + Batch',withTs(['Barcode','Batch','Status','Keterangan',...R.sdHead],R.sdAll,t.txt)]);
    S.push(infoSheet(t.txt,S.map(([n,a])=>[n,a.length-1])));
    const fn='hasil_cek_stock_'+t.fn+'.xlsx';save(await makeXlsx(S),fn);
    st('Diunduh: '+t.txt+' ('+fn+') - 4 sheet data + sheet Info.');
  },30);
};
$('#ext').onclick=async()=>{
  st('Menyusun file Excel...');
  const t=nowTs(),fn='hasil_'+tab+'_'+t.fn+'.xlsx',f=($('#flt').value||$('#q').value||$('#onlyd').checked)?' (sesuai filter/pencarian)':'';
  save(await makeXlsx([[TABS[tab].n,withTs(TABS[tab].h,view,t.txt)],infoSheet(t.txt,[[TABS[tab].t+f,view.length]])]),fn);
  st('Diunduh: '+t.txt+' ('+fn+')');
};
$('#exc').onclick=()=>{
  const t=nowTs(),fn='hasil_'+tab+'_'+t.fn+'.csv';
  const a=withTs(TABS[tab].h,view,t.txt).map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  save(new Blob(['\ufeffsep=,\n'+a],{type:'text/csv'}),fn);st('Diunduh: '+t.txt+' ('+fn+')');
};
let ip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#inst').classList.remove('hid')});
addEventListener('appinstalled',()=>$('#inst').classList.add('hid'));
$('#inst').onclick=async()=>{if(!ip)return;ip.prompt();await ip.userChoice;ip=null;$('#inst').classList.add('hid')};
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='update')$('#upd').classList.remove('hid')});
}
$('#rl').onclick=()=>location.reload();
const VERSI_APP='16 Nov 2026 (PZZL, konversi satuan)';$('#ver').textContent=VERSI_APP;
// Tombol ini membuang simpanan aplikasi lama lalu memuat ulang. Master Batch yang tersimpan TIDAK terhapus.

  try{for(const n of await caches.keys())await caches.delete(n);for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}catch(err){}

  const c=await kvGet('master');
